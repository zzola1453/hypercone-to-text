<text x="765" y="330" text-anchor="start" style="font-family:'Helvetica Neue',Arial,'Segoe UI',sans-serif;font-size:12px;font-weight:400" fill="#14181f">L_CE = −log softmax(s · cos(z, μ_k))_y</text>
<text x="765" y="354" text-anchor="start" style="font-family:'Helvetica Neue',Arial,'Segoe UI',sans-serif;font-size:12px;font-weight:400" fill="#b8501f">L_in = relu(∠(z, μ_y) − θ_y)</text>
<text x="765" y="378" text-anchor="start" style="font-family:'Helvetica Neue',Arial,'Segoe UI',sans-serif;font-size:12px;font-weight:400" fill="#b8501f">L_out = relu(max_k (θ_k − ∠(o′, μ_k)))</text>
<text x="765" y="410" text-anchor="start" style="font-family:'Helvetica Neue',Arial,'Segoe UI',sans-serif;font-size:12.5px;font-weight:600" fill="#14181f">L = L_CE + α·L_in + β·L_out</text>
